name: MONADIA simulation tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run the production simulation tick
        env:
          MONADIA_CRON_URL: ${{ secrets.MONADIA_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$MONADIA_CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$MONADIA_CRON_URL"
